name: Windows installer

# Every push builds Orbit and its setup program. The result is an artifact on
# the workflow run; a pushed tag like v0.1.0 also attaches it to a GitHub release.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # releases for tags

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # A tag on the wrong commit would publish an old build under a new version,
      # and installed copies would offer the same "update" forever.
      - name: Check the tag matches the version (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(orbit VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          if ('${{ github.ref_name }}' -ne "v$version") {
            throw "Tag ${{ github.ref_name }} is on a commit whose CMakeLists.txt says $version."
          }

      - name: Cache dependencies (CEF, SQLite)
        uses: actions/cache@v4
        with:
          path: |
            third_party/cef
            third_party/sqlite
            third_party/downloads
          key: deps-${{ hashFiles('scripts/fetch_deps.ps1') }}

      - name: Fetch dependencies
        shell: pwsh
        run: ./scripts/fetch_deps.ps1

      - name: Build, test and stage (Release)
        shell: pwsh
        run: ./scripts/package.ps1 -SkipSmoke

      - name: Build the installer
        shell: pwsh
        run: ./scripts/make_installer.ps1

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: Orbit Browser
          path: dist/Orbit Browser Setup.exe
          if-no-files-found: error

      - name: Upload the symbols (to read crash logs and minidumps)
        uses: actions/upload-artifact@v4
        with:
          name: Orbit symbols
          path: out/release/bin/orbit.pdb
          if-no-files-found: warn

      - name: Attach to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Orbit Browser Setup.exe
            dist/Orbit-*-win64.zip
